name: OCT tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: oct-tracker
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python tracker/tracker.py

      - name: Publish alert.json to data branch
        run: |
          mkdir /tmp/pub
          cp alert.json /tmp/pub/
          cd /tmp/pub
          git init -q -b data
          git config user.name "oct-bot"
          git config user.email "oct-bot@users.noreply.github.com"
          git add alert.json
          git commit -q -m "alert $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
