<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCT | OSINT CBRN Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="logo">
    <svg width="34" height="34" viewBox="0 0 34 34" fill="none" stroke="#f6b100" stroke-width="2.4"><circle cx="17" cy="17" r="14"/><circle cx="17" cy="17" r="8"/><circle cx="17" cy="17" r="2.5" fill="#f6b100"/></svg>
    <div><b>oct<span>24</span></b><i>OSINT CBRN TRACKER</i></div>
  </div>
  <div class="right-group">
    <span id="utc-clock" class="utc">--:--:-- UTC</span>
    <span id="local-clock" class="local"></span>
    <form id="search-form" class="search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#9aa0a6" stroke-width="1.6"><circle cx="7" cy="7" r="5"/><path d="M11 11l4 4"/></svg>
      <input id="search" placeholder="Go to lat, lon (e.g. 35.7, 51.4)" autocomplete="off">
      <kbd>/</kbd>
    </form>
  </div>
</header>

<div id="status-chip" class="chip gray"><span class="dot"></span><span id="status-text">Connecting...</span></div>

<div class="left">
  <aside class="card" id="events-card">
    <div class="card-head">
      <span class="ttl">Surface events</span><span class="live">LIVE</span><span class="badge" id="event-count">0</span>
      <button class="chev" aria-label="Collapse"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div id="events-list" class="list"></div>
    <div class="card-foot">Unofficial research tool. Not for emergency use.</div>
  </aside>
  <aside class="card" id="region-card">
    <div class="card-head">
      <span class="ttl">Monitored region</span><span class="live">LIVE</span>
      <button class="chev" aria-label="Collapse"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div id="region-info" class="pad"></div>
  </aside>
</div>

<aside class="card detail-card" id="detail-card" hidden>
  <div class="card-head"><span class="ttl" id="detail-title">Event</span><button class="x" id="detail-close" aria-label="Close">&times;</button></div>
  <div id="detail-body"></div>
</aside>

<div class="zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zfull" aria-label="Fullscreen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="zhome" aria-label="Center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
</div>

<nav class="dock">
  <button class="dock-btn on" data-layer="region"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="5" width="18" height="14" rx="2" stroke-dasharray="3 3"/></svg><span>Region</span></button>
  <button class="dock-btn on" data-layer="fast"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7M12 17v.01"/></svg><span>Unverified</span></button>
  <button class="dock-btn on" data-layer="plume"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 9h11a3 3 0 1 0-3-3M3 15h15a3 3 0 1 1-3 3M3 12h8"/></svg><span>Plume</span></button>
  <button class="dock-btn" id="demo-btn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 5l11 7-11 7z"/></svg><span>Demo</span></button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
