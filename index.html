<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCT | OSINT CBRN Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="logo"><span class="logo-mark"></span><b>OCT</b><i>OSINT CBRN Tracker</i></div>
  <div class="clocks"><span id="utc-clock">--:--:-- UTC</span><span id="local-clock"></span></div>
  <div id="status-chip" class="chip gray"><span class="dot"></span><span id="status-text">Connecting...</span></div>
  <form id="search-form" class="search">
    <input id="search" placeholder="Go to lat, lon  (e.g. 35.7, 51.4)" autocomplete="off">
  </form>
</header>

<aside class="card events-card">
  <div class="card-head"><span>Surface events</span><span class="badge" id="event-count">0</span></div>
  <div id="events-list" class="list"></div>
  <div class="card-foot">Unofficial research tool. Not for emergency use.</div>
</aside>

<aside class="card detail-card" id="detail-card" hidden>
  <div class="card-head"><span id="detail-title">Event</span><button class="x" id="detail-close" aria-label="Close">&times;</button></div>
  <div id="detail-body"></div>
</aside>

<div class="zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zhome" aria-label="Center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="3"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg></button>
</div>

<nav class="dock">
  <button class="dock-btn on" data-layer="region">Region</button>
  <button class="dock-btn on" data-layer="fast">Unverified</button>
  <button class="dock-btn on" data-layer="plume">Plume</button>
  <button class="dock-btn" id="demo-btn">Demo</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
