<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OCT | Open-Source CBRN Event Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>

<header class="topbar">
  <div class="title"><b>OCT</b><span>Open-Source CBRN Event Monitor</span></div>
  <div id="status-chip" class="chip gray"><span class="dot"></span><span id="status-text">Connecting</span></div>
  <div class="right-group">
    <div class="clocks"><span id="utc-clock">--:--:-- UTC</span><span id="local-clock"></span></div>
    <form id="search-form" class="search">
      <input id="search" placeholder="Go to coordinates: lat, lon" autocomplete="off">
    </form>
  </div>
</header>

<div class="left">
  <aside class="card" id="events-card">
    <div class="card-head">
      <span class="ttl">Surface Events</span><span class="badge" id="event-count">0</span>
      <button class="chev" aria-label="Collapse"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div id="events-list" class="list"></div>
    <div class="card-foot">Unofficial research tool. Not for emergency or operational use.</div>
  </aside>
  <aside class="card" id="region-card">
    <div class="card-head">
      <span class="ttl">Monitoring Region</span>
      <button class="chev" aria-label="Collapse"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 10l5-5 5 5"/></svg></button>
    </div>
    <div id="region-info" class="pad"></div>
  </aside>
</div>

<aside class="card detail-card" id="detail-card" hidden>
  <div class="card-head"><span class="ttl" id="detail-title">Event</span><button class="x" id="detail-close" aria-label="Close">&times;</button></div>
  <div id="detail-body"></div>
</aside>

<div class="zoom">
  <button id="zin" aria-label="Zoom in">+</button>
  <button id="zout" aria-label="Zoom out">&minus;</button>
  <button id="zhome" aria-label="Reset view">&#8982;</button>
  <button id="zfull" aria-label="Fullscreen">&#9974;</button>
</div>

<nav class="dock">
  <span class="dock-label">Layers</span>
  <button class="dock-btn on" data-layer="region">Region</button>
  <button class="dock-btn on" data-layer="fast">Unverified</button>
  <button class="dock-btn on" data-layer="plume">Plume</button>
  <span class="dock-sep"></span>
  <button class="dock-btn" id="demo-btn">Simulation</button>
</nav>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
